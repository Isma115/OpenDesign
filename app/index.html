<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoFlow Designer</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/themes.css">
</head>

<body style="background-color: #000000; margin: 0; overflow: hidden;">
  <div id="app">

    <!-- #region Barra superior | Panel | menu principal y acciones rapidas -->
    <header id="topbar">
      <div class="brand">
        <span class="brand-icon">&#9670;</span>
        <span class="brand-text">GeoFlow Designer</span>
      </div>

      <nav class="menu-bar" id="menu-bar">
        <div class="menu-item" data-menu="file">
          <button class="menu-trigger" aria-label="Menu archivo">Archivo</button>
          <div class="menu-dropdown" id="menu-file">
            <button data-action="new" aria-label="Nuevo proyecto">Nuevo</button>
            <button data-action="open" aria-label="Abrir archivo JSON">Abrir JSON</button>
            <hr>
            <button data-action="save" aria-label="Guardar localmente">Guardar</button>
            <button data-action="download-json" aria-label="Descargar JSON">Descargar JSON</button>
            <hr>
            <button data-action="export-html" aria-label="Exportar como HTML">Exportar HTML</button>
            <button data-action="export-svg" aria-label="Exportar como SVG">Exportar SVG</button>
            <button data-action="export-png" aria-label="Exportar como PNG">Exportar PNG</button>
          </div>
        </div>

        <div class="menu-item" data-menu="edit">
          <button class="menu-trigger" aria-label="Menu edicion">Editar</button>
          <div class="menu-dropdown" id="menu-edit">
            <button data-action="undo" aria-label="Deshacer">Deshacer <span class="shortcut">Ctrl+Z</span></button>
            <button data-action="redo" aria-label="Rehacer">Rehacer <span class="shortcut">Ctrl+Shift+Z</span></button>
            <hr>
            <button data-action="cut" aria-label="Cortar">Cortar <span class="shortcut">Ctrl+X</span></button>
            <button data-action="copy" aria-label="Copiar">Copiar <span class="shortcut">Ctrl+C</span></button>
            <button data-action="paste" aria-label="Pegar">Pegar <span class="shortcut">Ctrl+V</span></button>
            <button data-action="duplicate" aria-label="Duplicar">Duplicar <span class="shortcut">Ctrl+D</span></button>
            <button data-action="delete" aria-label="Eliminar">Eliminar <span class="shortcut">Del</span></button>
            <hr>
            <button data-action="select-all" aria-label="Seleccionar todo">Seleccionar todo <span
                class="shortcut">Ctrl+A</span></button>
          </div>
        </div>

        <div class="menu-item" data-menu="view">
          <button class="menu-trigger" aria-label="Menu vista">Ver</button>
          <div class="menu-dropdown" id="menu-view">
            <button data-action="toggle-grid" aria-label="Mostrar cuadricula">Cuadricula</button>
            <button data-action="toggle-snap" aria-label="Ajustar a cuadricula">Ajustar a cuadricula</button>
            <button data-action="toggle-guides" aria-label="Mostrar guias">Guias</button>
            <hr>
            <button data-action="toggle-theme" aria-label="Cambiar tema">Modo oscuro</button>
            <hr>
            <button data-action="zoom-50" aria-label="Zoom 50%">Zoom 50%</button>
            <button data-action="zoom-100" aria-label="Zoom 100%">Zoom 100%</button>
            <button data-action="zoom-200" aria-label="Zoom 200%">Zoom 200%</button>
            <button data-action="zoom-fit" aria-label="Ajustar al contenido">Ajustar al contenido</button>
          </div>
        </div>

        <div class="menu-item" data-menu="organize">
          <button class="menu-trigger" aria-label="Menu organizar">Organizar</button>
          <div class="menu-dropdown" id="menu-organize">
            <button data-action="bring-front" aria-label="Traer al frente">Traer al frente</button>
            <button data-action="send-back" aria-label="Enviar al fondo">Enviar al fondo</button>
            <button data-action="bring-forward" aria-label="Adelantar">Adelantar</button>
            <button data-action="send-backward" aria-label="Atrasar">Atrasar</button>
            <hr>
            <button data-action="align-left" aria-label="Alinear izquierda">Alinear izquierda</button>
            <button data-action="align-center" aria-label="Alinear centro">Alinear centro</button>
            <button data-action="align-right" aria-label="Alinear derecha">Alinear derecha</button>
            <hr>
            <button data-action="distribute-h" aria-label="Distribuir horizontalmente">Distribuir horizontal</button>
            <button data-action="distribute-v" aria-label="Distribuir verticalmente">Distribuir vertical</button>
            <hr>
            <button data-action="group" aria-label="Agrupar">Agrupar <span class="shortcut">Ctrl+G</span></button>
            <button data-action="ungroup" aria-label="Desagrupar">Desagrupar <span
                class="shortcut">Ctrl+Shift+G</span></button>
          </div>
        </div>
      </nav>

      <div class="topbar-center">
        <input type="text" id="doc-name" value="Nuevo diseno" aria-label="Nombre del documento" spellcheck="false">
      </div>

      <div class="topbar-actions">
        <button id="btn-undo" class="icon-btn" aria-label="Deshacer" title="Deshacer (Ctrl+Z)">&#8630;</button>
        <button id="btn-redo" class="icon-btn" aria-label="Rehacer" title="Rehacer (Ctrl+Shift+Z)">&#8631;</button>
        <div class="separator"></div>
        <button id="btn-zoom-out" class="icon-btn" aria-label="Reducir zoom" title="Reducir zoom">-</button>
        <span id="zoom-display" class="zoom-display">100%</span>
        <button id="btn-zoom-in" class="icon-btn" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
        <div class="separator"></div>
        <button id="btn-theme" class="icon-btn" aria-label="Cambiar tema" title="Cambiar tema">&#9789;</button>
      </div>
    </header>
    <!-- #endregion -->

    <main id="workspace">

      <!-- #region Barra lateral izquierda | Sidebar | herramientas de dibujo -->
      <aside id="left-toolbar">
        <div class="tool-section">
          <button class="tool-btn active" data-tool="select" aria-label="Seleccion" title="Seleccion (V)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M4 4l7 18 2.5-7.5L21 12z" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="hand" aria-label="Mano" title="Mano (H)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M18 11V6a2 2 0 00-4 0v1M14 7V4a2 2 0 00-4 0v6M10 5.5V4a2 2 0 00-4 0v8" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M18 11a2 2 0 014 0v3a8 8 0 01-8 8h-2a8 8 0 01-6-2.7L3.3 16a2 2 0 012.7-2.7L8 15" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-section">
          <button class="tool-btn" data-tool="rectangle" aria-label="Rectangulo" title="Rectangulo (R)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="roundedRectangle" aria-label="Rectangulo redondeado"
            title="Rectangulo redondeado">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="3" y="5" width="18" height="14" rx="5" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="ellipse" aria-label="Elipse" title="Elipse (O)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <ellipse cx="12" cy="12" rx="9" ry="7" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="triangle" aria-label="Triangulo" title="Triangulo">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="12,3 22,21 2,21" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="diamond" aria-label="Rombo" title="Rombo">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="pentagon" aria-label="Pentagono" title="Pentagono">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="12,2 22,9 19,20 5,20 2,9" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="hexagon" aria-label="Hexagono" title="Hexagono">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="star" aria-label="Estrella" title="Estrella">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="12,2 15,9 22,9 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9 9,9" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-section">
          <button class="tool-btn" data-tool="line" aria-label="Linea" title="Linea (L)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="arrow" aria-label="Flecha" title="Flecha">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <line x1="4" y1="20" x2="18" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <polyline points="12,6 18,6 18,12" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="connector" aria-label="Conector" title="Conector (C)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M4 12h6v-8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
              <polyline points="17,1 20,4 17,7" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-section">
          <button class="tool-btn" data-tool="text" aria-label="Texto" title="Texto (T)">
            <svg viewBox="0 0 24 24" width="20" height="20"><text x="6" y="18" font-size="16" font-weight="bold"
                fill="currentColor" font-family="sans-serif">T</text></svg>
          </button>
          <button class="tool-btn" data-tool="note" aria-label="Nota" title="Nota">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
              <line x1="7" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="1.5" />
              <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="1.5" />
              <line x1="7" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-section">
          <button class="tool-btn" data-tool="flow-start" aria-label="Inicio/Fin" title="Inicio/Fin">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="2" y="6" width="20" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="flow-process" aria-label="Proceso" title="Proceso">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="flow-decision" aria-label="Decision" title="Decision">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="flow-io" aria-label="Entrada/Salida" title="Entrada/Salida">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="6,5 22,5 18,19 2,19" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="flow-database" aria-label="Base de datos" title="Base de datos">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="flow-document" aria-label="Documento" title="Documento">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M3 4h18v14c-3-2-6 2-9 0s-6-2-9 0V4z" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="flow-subprocess" aria-label="Subproceso" title="Subproceso">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2" />
              <line x1="6" y1="5" x2="6" y2="19" stroke="currentColor" stroke-width="1.5" />
              <line x1="18" y1="5" x2="18" y2="19" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-section">
          <button class="tool-btn" data-tool="frame" aria-label="Frame" title="Frame/Contenedor">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-dasharray="4 2" />
            </svg>
          </button>
        </div>
      </aside>
      <!-- #endregion -->

      <!-- #region Lienzo central | Vista | area principal de dibujo SVG -->
      <section id="canvas-wrapper">
        <div id="rulers">
          <canvas id="ruler-h" height="20"></canvas>
          <canvas id="ruler-v" width="20"></canvas>
          <div id="ruler-corner"></div>
        </div>
        <div id="canvas-container">
          <svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
            <defs id="svg-defs">
              <marker id="arrow-marker" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"
                markerUnits="strokeWidth">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"></path>
              </marker>
              <marker id="arrow-marker-selected" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"
                markerUnits="strokeWidth">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"></path>
              </marker>
              <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5" opacity="0.3" />
              </pattern>
              <pattern id="grid-pattern-large" width="200" height="200" patternUnits="userSpaceOnUse">
                <rect width="200" height="200" fill="url(#grid-pattern)" />
                <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#d1d5db" stroke-width="1" opacity="0.4" />
              </pattern>
            </defs>
            <g id="grid-layer">
              <rect width="100%" height="100%" fill="url(#grid-pattern-large)" class="grid-bg" />
            </g>
            <g id="background-layer"></g>
            <g id="connector-layer"></g>
            <g id="shape-layer"></g>
            <g id="text-layer"></g>
            <g id="selection-layer"></g>
            <g id="guide-layer"></g>
            <g id="preview-layer"></g>
          </svg>
        </div>
      </section>
      <!-- #endregion -->

      <!-- #region Panel derecho | Panel | propiedades del elemento seleccionado -->
      <aside id="right-panel">
        <div id="panel-tabs">
          <button class="panel-tab active" data-tab="properties" aria-label="Propiedades">Propiedades</button>
          <button class="panel-tab" data-tab="layers" aria-label="Capas">Capas</button>
          <button class="panel-tab" data-tab="components" aria-label="Componentes">Componentes</button>
        </div>

        <div id="panel-content">
          <div id="tab-properties" class="tab-content active">
            <div id="properties-empty" class="panel-section">
              <p class="panel-hint">Selecciona un elemento para editar sus propiedades</p>
            </div>

            <div id="properties-canvas" class="panel-section" style="display:none">
              <h3 class="panel-title">Lienzo</h3>
              <div class="prop-group">
                <label>Ancho</label>
                <input type="number" id="prop-canvas-width" value="1920" min="100">
              </div>
              <div class="prop-group">
                <label>Alto</label>
                <input type="number" id="prop-canvas-height" value="1080" min="100">
              </div>
              <div class="prop-group">
                <label>Fondo</label>
                <input type="color" id="prop-canvas-bg" value="#ffffff">
              </div>
              <div class="prop-group">
                <label>Cuadricula</label>
                <input type="number" id="prop-grid-size" value="16" min="4" max="100">
              </div>
            </div>

            <div id="properties-shape" class="panel-section" style="display:none">
              <h3 class="panel-title">Posicion y tamano</h3>
              <div class="prop-row">
                <div class="prop-group">
                  <label>X</label>
                  <input type="number" id="prop-x" step="1">
                </div>
                <div class="prop-group">
                  <label>Y</label>
                  <input type="number" id="prop-y" step="1">
                </div>
              </div>
              <div class="prop-row">
                <div class="prop-group">
                  <label>W</label>
                  <input type="number" id="prop-w" min="10" step="1">
                </div>
                <div class="prop-group">
                  <label>H</label>
                  <input type="number" id="prop-h" min="10" step="1">
                </div>
              </div>
              <div class="prop-group">
                <label>Rotacion</label>
                <input type="range" id="prop-rotation" min="0" max="360" value="0">
                <span id="prop-rotation-val">0&deg;</span>
              </div>

              <h3 class="panel-title">Estilo</h3>
              <div class="prop-row">
                <div class="prop-group">
                  <label>Relleno</label>
                  <input type="color" id="prop-fill" value="#ffffff">
                </div>
                <div class="prop-group">
                  <label>Borde</label>
                  <input type="color" id="prop-stroke" value="#111827">
                </div>
              </div>
              <div class="prop-group">
                <label>Grosor borde</label>
                <input type="number" id="prop-stroke-width" min="0" max="20" value="2" step="1">
              </div>
              <div class="prop-group">
                <label>Opacidad</label>
                <input type="range" id="prop-opacity" min="0" max="1" step="0.05" value="1">
                <span id="prop-opacity-val">100%</span>
              </div>
              <div class="prop-group">
                <label>Linea punteada</label>
                <select id="prop-dash">
                  <option value="">Solida</option>
                  <option value="5,5">Discontinua</option>
                  <option value="2,2">Puntos</option>
                  <option value="10,5,2,5">Discontinua larga</option>
                </select>
              </div>

              <h3 class="panel-title">Texto</h3>
              <div class="prop-group">
                <textarea id="prop-text" rows="2" placeholder="Texto del elemento"></textarea>
              </div>
              <div class="prop-row">
                <div class="prop-group">
                  <label>Fuente</label>
                  <select id="prop-font-family">
                    <option value="Inter, Arial, sans-serif">Inter</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="Courier New, monospace">Courier New</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                  </select>
                </div>
                <div class="prop-group">
                  <label>Tamano</label>
                  <input type="number" id="prop-font-size" min="8" max="120" value="16">
                </div>
              </div>
              <div class="prop-row">
                <div class="prop-group">
                  <label>Color texto</label>
                  <input type="color" id="prop-text-color" value="#111827">
                </div>
                <div class="prop-group">
                  <label>Alineacion</label>
                  <select id="prop-text-align">
                    <option value="left">Izquierda</option>
                    <option value="center" selected>Centro</option>
                    <option value="right">Derecha</option>
                  </select>
                </div>
              </div>
              <div class="prop-group">
                <label>Peso</label>
                <select id="prop-font-weight">
                  <option value="400">Normal</option>
                  <option value="600">Semibold</option>
                  <option value="700">Bold</option>
                </select>
              </div>

              <h3 class="panel-title">CSS HTML</h3>
              <div class="prop-group">
                <label>Nombre CSS especifico</label>
                <input type="text" id="prop-css-class" list="component-css-names" placeholder="gf-button">
                <datalist id="component-css-names"></datalist>
              </div>
              <div class="prop-group">
                <label>Reglas CSS compartidas</label>
                <textarea id="prop-component-css" class="code-textarea" rows="7"
                  placeholder="background: #ffffff;&#10;border-radius: 8px;"></textarea>
              </div>

              <h3 class="panel-title">Organizar</h3>
              <div class="prop-group">
                <label>Capa</label>
                <input type="number" id="prop-layer" step="1">
              </div>
              <div class="prop-actions">
                <button data-action="bring-front" aria-label="Traer al frente" title="Al frente">&#8676;</button>
                <button data-action="bring-forward" aria-label="Adelantar" title="Adelantar">&#8593;</button>
                <button data-action="send-backward" aria-label="Atrasar" title="Atrasar">&#8595;</button>
                <button data-action="send-back" aria-label="Enviar al fondo" title="Al fondo">&#8677;</button>
                <button id="btn-lock" data-action="toggle-lock" aria-label="Bloquear"
                  title="Bloquear">&#128274;</button>
                <button data-action="duplicate" aria-label="Duplicar" title="Duplicar">&#9851;</button>
                <button data-action="delete" class="danger" aria-label="Eliminar" title="Eliminar">&#10005;</button>
              </div>
            </div>

            <div id="properties-connector" class="panel-section" style="display:none">
              <h3 class="panel-title">Conector</h3>
              <div class="prop-group">
                <label>Tipo</label>
                <select id="prop-connector-type">
                  <option value="straight">Recto</option>
                  <option value="orthogonal" selected>Ortogonal</option>
                  <option value="curved">Curvo</option>
                </select>
              </div>
              <div class="prop-row">
                <div class="prop-group">
                  <label>Color</label>
                  <input type="color" id="prop-conn-stroke" value="#111827">
                </div>
                <div class="prop-group">
                  <label>Grosor</label>
                  <input type="number" id="prop-conn-stroke-width" min="1" max="10" value="2">
                </div>
              </div>
              <div class="prop-group">
                <label>Flecha final</label>
                <select id="prop-conn-end-marker">
                  <option value="">Ninguna</option>
                  <option value="arrow" selected>Flecha</option>
                </select>
              </div>
              <div class="prop-group">
                <label>Linea punteada</label>
                <select id="prop-conn-dash">
                  <option value="">Solida</option>
                  <option value="5,5">Discontinua</option>
                  <option value="2,2">Puntos</option>
                </select>
              </div>
              <div class="prop-group">
                <label>Capa</label>
                <input type="number" id="prop-conn-layer" step="1">
              </div>
              <h3 class="panel-title">Etiqueta</h3>
              <div class="prop-group">
                <input type="text" id="prop-conn-label" placeholder="Etiqueta (ej: Si, No)">
              </div>
            </div>
          </div>

          <div id="tab-layers" class="tab-content" style="display:none">
            <div id="layers-list" class="layers-list"></div>
          </div>

          <div id="tab-components" class="tab-content" style="display:none">
            <h3 class="panel-title">Componentes UI</h3>
            <div id="component-library" class="component-library">
              <button class="component-item" data-component="button" draggable="true">
                <span class="comp-preview comp-button"></span>
                <span>Boton</span>
              </button>
              <button class="component-item" data-component="input" draggable="true">
                <span class="comp-preview comp-input"></span>
                <span>Input</span>
              </button>
              <button class="component-item" data-component="textarea" draggable="true">
                <span class="comp-preview comp-textarea"></span>
                <span>Textarea</span>
              </button>
              <button class="component-item" data-component="checkbox" draggable="true">
                <span class="comp-preview comp-checkbox"></span>
                <span>Checkbox</span>
              </button>
              <button class="component-item" data-component="toggle" draggable="true">
                <span class="comp-preview comp-toggle"></span>
                <span>Toggle</span>
              </button>
              <button class="component-item" data-component="card" draggable="true">
                <span class="comp-preview comp-card"></span>
                <span>Card</span>
              </button>
              <button class="component-item" data-component="avatar" draggable="true">
                <span class="comp-preview comp-avatar"></span>
                <span>Avatar</span>
              </button>
              <button class="component-item" data-component="navbar" draggable="true">
                <span class="comp-preview comp-navbar"></span>
                <span>Barra superior</span>
              </button>
              <button class="component-item" data-component="sidebar" draggable="true">
                <span class="comp-preview comp-sidebar"></span>
                <span>Menu lateral</span>
              </button>
              <button class="component-item" data-component="table" draggable="true">
                <span class="comp-preview comp-table"></span>
                <span>Tabla</span>
              </button>
              <button class="component-item" data-component="image" draggable="true">
                <span class="comp-preview comp-image"></span>
                <span>Imagen</span>
              </button>
              <button class="component-item" data-component="modal" draggable="true">
                <span class="comp-preview comp-modal"></span>
                <span>Modal</span>
              </button>
            </div>
          </div>

        </div>
      </aside>
      <!-- #endregion -->

    </main>

    <!-- #region Barra inferior | Panel | estado, coordenadas y zoom -->
    <footer id="statusbar">
      <span id="status-coords">X: 0 &nbsp; Y: 0</span>
      <span id="status-info"></span>
      <span id="status-zoom">100%</span>
      <span id="status-saved">Sin cambios</span>
    </footer>
    <!-- #endregion -->

  </div>

  <input type="file" id="file-input" accept=".json,.geoflow.json" style="display:none">

  <script type="module" src="js/main.js"></script>
</body>

</html>
